spring:
  application:
    name: meeting-room-management # oluşturulan database in adı
  profiles:
    active: dev
  messages:
    basename: messages
    use-code-as-default-message: true
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: tr
    locale-resolver: accept_header
  mail:
    host: localhost # E-posta gönderim motorunun otomatik oluşması için eklendi

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers, circuitbreakers

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173
jwt:
  secret: dGhpc2lzYXZlcnlzZWN1cmVrZXlmb3Jqd3R0ZXN0aW5nYmFzZTY0ZW5jb2RlZA==
  access-token-expiration: 900000
  refresh-token-expiration: 2592000000
